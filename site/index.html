<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SCOTUS Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Track the U.S. Supreme Court's current term: the docket, argument calendar, decisions, emergency docket, justices and stats.">
<meta name="theme-color" content="#1c2430">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SCOTUS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: an inscribed masthead band over a sticky tab rail; each tab is a single working view
   built from cards only where an item is a distinct record (a case, a justice). */
:root {
  --bg: #f3f4f1;          /* marble */
  --surface: #ffffff;
  --sunk: #e9ebe6;
  --ink: #1c2430;         /* slate ink */
  --muted: #5a6371;
  --line: #d8dbd4;
  --accent: #7d1f2c;      /* courtroom curtain */
  --accent-soft: #f4e5e7;
  --band: #1c2430;
  --band-ink: #eef0ec;
  --band-muted: #a9b1bc;
  --granted: #5a6371;
  --scheduled: #2c5a88;
  --argued: #9a6200;
  --decided: #2f6a4c;
  --dismissed: #8a8f97;
  --scheduled-soft: #e3ecf5;
  --argued-soft: #f6ecd9;
  --decided-soft: #e2efe7;
  --granted-soft: #eceef0;
  --focus: #2c5a88;
  --font-display: "Cinzel", "Trajan Pro", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
  --step--1: 0.8125rem;
  --step-0: 0.9375rem;
  --step-1: 1.125rem;
  --step-2: 1.375rem;
  --step-3: 1.875rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151b; --surface: #181e26; --sunk: #0d1116; --ink: #e6e8e3; --muted: #9aa3ae; --line: #2a323d;
    --accent: #e0848f; --accent-soft: #3a1f25; --band: #0b0e13; --band-ink: #eef0ec; --band-muted: #8f98a3;
    --granted: #a3abb5; --scheduled: #86b2de; --argued: #e0b25c; --decided: #7cc39c; --dismissed: #7d838b;
    --scheduled-soft: #1b2a3a; --argued-soft: #33270f; --decided-soft: #16291f; --granted-soft: #222831;
    --focus: #86b2de; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151b; --surface: #181e26; --sunk: #0d1116; --ink: #e6e8e3; --muted: #9aa3ae; --line: #2a323d;
  --accent: #e0848f; --accent-soft: #3a1f25; --band: #0b0e13; --band-ink: #eef0ec; --band-muted: #8f98a3;
  --granted: #a3abb5; --scheduled: #86b2de; --argued: #e0b25c; --decided: #7cc39c; --dismissed: #7d838b;
  --scheduled-soft: #1b2a3a; --argued-soft: #33270f; --decided-soft: #16291f; --granted-soft: #222831;
  --focus: #86b2de; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }

html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: var(--step-0); line-height: 1.5; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
a { color: var(--accent); text-underline-offset: 2px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: var(--step--1); }

/* Masthead */
.mast { background: var(--band); color: var(--band-ink); }
.mast .wrap { padding-block: 20px 16px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.brand { display: grid; gap: 2px; }
.motto { font-family: var(--font-display); letter-spacing: 0.32em; font-size: 0.6875rem; color: var(--band-muted); text-transform: uppercase; }
.wordmark { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.6rem, 4.5vw, 2.4rem); letter-spacing: 0.08em; line-height: 1.1; }
.term-line { font-size: var(--step--1); color: var(--band-muted); }
.term-line b { color: var(--band-ink); font-weight: 500; }
.mast-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill-live { display: inline-flex; align-items: center; gap: 8px; font-size: var(--step--1); border: 1px solid #3a4452; border-radius: 999px; padding: 4px 12px; color: var(--band-ink); }
.pill-live i { width: 8px; height: 8px; border-radius: 50%; background: #8f98a3; display: inline-block; }
.pill-live[data-state="live"] i { background: #5fc28d; box-shadow: 0 0 0 3px rgba(95,194,141,.18); }
.btn-band { background: transparent; border: 1px solid #3a4452; color: var(--band-ink); border-radius: 999px; padding: 4px 12px; font-size: var(--step--1); cursor: pointer; }
.btn-band:hover { border-color: var(--band-muted); }

/* Tabs */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs .wrap::-webkit-scrollbar { display: none; }
.tab { flex: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: 12px 12px 10px; cursor: pointer; color: var(--muted); font-weight: 500; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .count { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); margin-left: 4px; }

main .wrap { padding-block: 24px 48px; }
.view { display: grid; gap: 28px; }
.view-head { display: grid; gap: 6px; }
.eyebrow { font-family: var(--font-display); font-size: 0.75rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.view-head h2 { font-size: var(--step-3); font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
.view-head p { margin: 0; color: var(--muted); max-width: 68ch; }
.section-title { font-family: var(--font-display); font-weight: 600; font-size: var(--step-1); letter-spacing: 0.06em; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.section-title small { font-family: var(--font-body); letter-spacing: 0; font-weight: 400; font-size: var(--step--1); color: var(--muted); }
.stack { display: grid; gap: 12px; }

/* Overview */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } }
.next { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 14px; }
.next-top { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.days { font-family: var(--font-display); font-weight: 700; font-size: 3.25rem; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.next-top div { display: grid; }
.next-top strong { font-size: var(--step-1); }
.next ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.next li { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 10px; align-items: baseline; }
.linkish { background: none; border: 0; padding: 0; color: var(--ink); text-align: left; cursor: pointer; font-weight: 500; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.linkish:hover { text-decoration-color: var(--accent); }

.pipeline { display: grid; gap: 12px; align-content: start; }
.pipe-bar { display: flex; height: 14px; border-radius: 3px; overflow: hidden; background: var(--sunk); }
.pipe-bar span { display: block; height: 100%; }
.pipe-legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; margin: 0; }
.pipe-legend button { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 8px; align-items: center; background: none; border: 0; padding: 6px 0; cursor: pointer; text-align: left; border-bottom: 1px dashed var(--line); }
.pipe-legend .sw { width: 10px; height: 10px; border-radius: 2px; }
.pipe-legend b { font-family: var(--font-mono); font-weight: 500; }

.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
@media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
.list-plain { list-style: none; margin: 0; padding: 0; display: grid; }
.list-plain li { padding: 10px 0; border-bottom: 1px solid var(--line); display: grid; gap: 2px; min-width: 0; }
.list-plain li:last-child { border-bottom: 0; }
.meta { font-size: var(--step--1); color: var(--muted); }

/* Status pills */
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.02em; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-granted { color: var(--granted); background: var(--granted-soft); }
.s-scheduled { color: var(--scheduled); background: var(--scheduled-soft); }
.s-argued { color: var(--argued); background: var(--argued-soft); }
.s-decided { color: var(--decided); background: var(--decided-soft); }
.s-dismissed { color: var(--dismissed); background: var(--granted-soft); }
.chip { display: inline-block; font-size: 0.75rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }

/* Docket */
.filters { display: grid; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.filter-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: var(--step--1); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.field { display: flex; align-items: center; gap: 6px; }
.field input, .field select { border: 1px solid var(--line); background: var(--bg); border-radius: var(--r); padding: 6px 10px; min-width: 0; }
#q { width: min(320px, 100%); }
.field-grow { flex: 1 1 220px; }
.field-grow input { width: 100%; }
.result-count { font-size: var(--step--1); color: var(--muted); }

.cases { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; }
.case { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 14px 12px; display: grid; gap: 8px; grid-template-rows: auto auto 1fr auto; min-width: 0; }
.case-top { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.case-top .mono { font-size: var(--step--1); color: var(--muted); }
.case h3 { font-size: var(--step-0); font-weight: 600; line-height: 1.35; }
.case h3 button { all: unset; cursor: pointer; }
.case h3 button:hover { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.case h3 button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.case p { margin: 0; color: var(--muted); font-size: var(--step--1); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.case-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: var(--step--1); color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }
.case-foot .tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.star { background: none; border: 0; cursor: pointer; padding: 2px; color: var(--muted); line-height: 0; }
.star svg { width: 18px; height: 18px; }
.star[aria-pressed="true"] { color: var(--accent); }
.star[aria-pressed="true"] path { fill: currentColor; }
.flag { color: var(--accent); font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
.empty { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }

/* Calendar */
.months { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 20px; }
.month { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; align-content: start; }
.month h3 { font-family: var(--font-display); font-size: var(--step-0); letter-spacing: 0.1em; font-weight: 600; }
.grid7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; text-align: center; font-variant-numeric: tabular-nums; }
.grid7 .dow { font-size: 0.6875rem; color: var(--muted); padding-bottom: 2px; }
.grid7 .d { font-size: var(--step--1); padding: 6px 0; border-radius: 4px; color: var(--muted); }
.grid7 .d.arg { background: var(--accent); color: var(--surface); font-weight: 600; cursor: pointer; border: 0; font: inherit; font-size: var(--step--1); }
.grid7 .d.past.arg { background: var(--accent-soft); color: var(--accent); }
.grid7 .d.today { outline: 1.5px solid var(--ink); outline-offset: -1.5px; color: var(--ink); }
.agenda { display: grid; gap: 0; }
.agenda-day { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); scroll-margin-top: 70px; }
.agenda-day:last-child { border-bottom: 0; }
.agenda-day time { font-weight: 600; }
.agenda-day time span { display: block; font-weight: 400; color: var(--muted); font-size: var(--step--1); }
.agenda-day ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.agenda-day li { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
@media (max-width: 520px) { .agenda-day { grid-template-columns: 1fr; gap: 6px; } }
.agenda-day.flash { background: var(--accent-soft); transition: background 1.2s; }

/* Decisions */
.rulings { display: grid; gap: 0; }
.ruling { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 20px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.ruling:last-child { border-bottom: 0; }
.ruling h3 { font-size: var(--step-1); font-weight: 600; }
.ruling p { margin: 0; max-width: 72ch; }
.ruling .meta { grid-column: 1 / -1; }
.vote { display: grid; gap: 4px; justify-items: end; align-content: start; }
.vote-num { font-family: var(--font-display); font-weight: 700; font-size: var(--step-2); line-height: 1; }
.dots { display: flex; gap: 3px; }
.dots span { width: 18px; display: grid; justify-items: center; gap: 2px; font-size: 0.5625rem; color: var(--muted); font-family: var(--font-mono); }
.dots i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--ink); display: block; }
.dots i.maj { background: var(--ink); }
@media (max-width: 560px) { .ruling { grid-template-columns: 1fr; } .vote { justify-items: start; } }

/* Tiles + charts */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 4px; align-content: start; }
.tile b { font-family: var(--font-display); font-size: 2rem; line-height: 1.05; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile span { font-size: var(--step--1); color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.chart-wrap { overflow-x: auto; }
.chart-wrap svg { display: block; width: 100%; min-width: 420px; height: auto; }
.hbars { display: grid; gap: 8px; }
.hbar { display: grid; grid-template-columns: minmax(7rem, 11rem) minmax(0, 1fr) 2.5rem; gap: 10px; align-items: center; font-size: var(--step--1); }
.hbar .track { background: var(--sunk); height: 10px; border-radius: 2px; overflow: hidden; }
.hbar .fill { background: var(--ink); height: 100%; border-radius: 2px; }
.hbar .n { font-family: var(--font-mono); text-align: right; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: var(--step--1); color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.facts li { padding: 10px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: baseline; }
.facts li:last-child { border-bottom: 0; }
.facts b { font-family: var(--font-mono); font-weight: 500; text-align: right; }

/* Justices */
.bench { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 12px; }
.justice { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; grid-template-rows: auto auto 1fr; }
.j-head { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; }
.seal { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 0.9375rem; border: 1.5px solid var(--ink); }
.justice h3 { font-size: var(--step-0); font-weight: 600; line-height: 1.3; }
.justice dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: var(--step--1); }
.justice dt { color: var(--muted); }
.justice dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.j-note { font-size: var(--step--1); border-top: 1px solid var(--line); padding-top: 8px; color: var(--muted); align-self: end; }
.j-note strong { color: var(--ink); font-weight: 600; }

/* Reading */
.articles { display: grid; gap: 0; }
.article { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.article:last-child { border-bottom: 0; }
.article time { font-size: var(--step--1); color: var(--muted); font-variant-numeric: tabular-nums; }
.article a { font-weight: 600; color: var(--ink); text-decoration: none; }
.article a:hover { color: var(--accent); text-decoration: underline; }
.article p { margin: 4px 0 0; font-size: var(--step--1); color: var(--muted); }
.new-badge { font-size: 0.6875rem; font-weight: 600; color: var(--decided); margin-left: 6px; }
@media (max-width: 520px) { .article { grid-template-columns: 1fr; gap: 2px; } }
.links-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 10px; }
.links-grid a { display: grid; gap: 2px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); text-decoration: none; }
.links-grid a:hover { border-color: var(--accent); }
.links-grid a span { font-size: var(--step--1); color: var(--muted); }

/* Dialog */
dialog { border: 1px solid var(--line); border-radius: 10px; padding: 0; background: var(--surface); color: var(--ink); width: min(640px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); }
dialog::backdrop { background: rgba(10, 14, 20, 0.5); }
.dlg { display: grid; gap: 16px; padding: 20px; }
.dlg-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.dlg h2 { font-size: var(--step-2); font-weight: 600; line-height: 1.25; }
.x { background: var(--sunk); border: 0; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-size: 1.1rem; line-height: 1; }
.dlg p { margin: 0; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.timeline li { border-top: 3px solid var(--line); padding-top: 8px; display: grid; gap: 2px; font-size: var(--step--1); }
.timeline li.done { border-top-color: var(--ink); }
.timeline li.next-step { border-top-color: var(--accent); }
.timeline b { font-weight: 600; font-size: var(--step-0); }
.brief-strip { display: grid; gap: 6px; }
.brief-strip .covers { display: flex; gap: 4px; flex-wrap: wrap; }
.brief-strip .covers span { font-size: 0.6875rem; padding: 3px 8px; border-radius: 3px; border: 1px solid rgba(0,0,0,.18); color: #1c2430; }
.dlg-links { display: flex; flex-wrap: wrap; gap: 8px; }

  { k: "B", name: "Amy Coney Barrett", role: "Associate Justice", by: "Trump", born: "1972-01-28", since: "2020-10-27",
    note: "In the majority <strong>92%</strong> of the time. The only justice with <strong>no</strong> noted emergency-docket dissents." },
  { k: "J", name: "Ketanji Brown Jackson", role: "Associate Justice", by: "Biden", born: "1970-09-14", since: "2022-06-30",
    note: "Most dissents last term (<strong>10</strong>) and most noted emergency-docket dissents (<strong>15</strong>)." },
];
const SLIP_JUDGE = { R: "Roberts", T: "Thomas", A: "Alito", S: "Sotomayor", K: "Kagan", G: "Gorsuch", KB: "Kavanaugh", BK: "Kavanaugh", B: "Barrett", AB: "Barrett", ACB: "Barrett", J: "Jackson", KBJ: "Jackson", PC: "Per curiam" };

/* ---------- Helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const isoLocal = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const TODAY = isoLocal(new Date());
const parseDay = (iso) => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const MONTHS = ["Jan.", "Feb.", "March", "April", "May", "June", "July", "Aug.", "Sept.", "Oct.", "Nov.", "Dec."];
const WEEKDAYS = ["Sun.", "Mon.", "Tue.", "Wed.", "Thu.", "Fri.", "Sat."];
function fmt(iso, opts = {}) {
  if (!iso) return "";
  const parts = iso.split("-");
  if (parts.length === 2) return `${MONTHS[+parts[1] - 1]} ${parts[0]}`;
  const d = parseDay(iso);
  const s = `${MONTHS[d.getMonth()]} ${d.getDate()}`;
  return (opts.wd ? WEEKDAYS[d.getDay()] + " " : "") + s + (opts.y ? `, ${d.getFullYear()}` : "");
}
const daysBetween = (a, b) => Math.round((parseDay(b) - parseDay(a)) / 864e5);
function store(key, val) { try { if (val === undefined) return JSON.parse(localStorage.getItem(key) || "null"); localStorage.setItem(key, JSON.stringify(val)); } catch { return null; } }
const docketUrl = (d) => /^\d{2}-\d+$/.test(d) ? `https://www.supremecourt.gov/docket/docketfiles/html/public/${d}.html` : `https://www.supremecourt.gov/search.aspx?filename=/docket/docketfiles/html/public/${d.toLowerCase()}.html`;
const blogSearch = (n) => `https://www.scotusblog.com/?s=${encodeURIComponent(n.split(" v. ")[0])}`;

/* ---------- State ---------- */
const state = {
  term: SNAP.term,
  cases: SNAP.cases.map((c) => ({ docket: c.d, name: c.n, lower: c.lc, granted: c.g, argued: c.a || null, topic: c.t, q: c.q, big: !!c.big, dismissed: c.dismissed || null })),
  extraOpinions: [],
  articles: SNAP.articles.map((a) => ({ ...a })),
  liveAt: null,
  liveTermChanged: false,
  watch: new Set(store("watch") || []),
  filters: { status: "all", topic: "", sitting: "", q: "", watch: false },
};
function statusOf(c) {
  if (c.dismissed) return "dismissed";
  if (c.decided) return "decided";
  if (c.argued && c.argued <= TODAY) return "argued";
  if (c.argued) return "scheduled";
  return "granted";
}
const STATUS_LABEL = { granted: "Awaiting argument date", scheduled: "Argument scheduled", argued: "Argued, awaiting decision", decided: "Decided", dismissed: "Dismissed" };
const STATUS_SHORT = { granted: "Granted", scheduled: "Scheduled", argued: "Argued", decided: "Decided", dismissed: "Dismissed" };
const statusPill = (s) => `<span class="status s-${s}">${STATUS_SHORT[s]}</span>`;
const sittingOf = (c) => c.argued ? MONTHS[parseDay(c.argued).getMonth()].replace(".", "") : "";

/* ---------- Live data ---------- */
async function loadLive() {
  for (const url of LIVE_URLS) {
    try {
      const res = await fetch(url, { cache: "no-cache" });
      if (!res.ok) continue;
      const live = await res.json();
      if (live && live.generatedAt) { applyLive(live); return true; }
    } catch { /* try the next source */ }
  }
  return false;
}
function applyLive(live) {
  state.liveAt = live.generatedAt;
  if (live.term && live.term > state.term) {
    // A new term has opened since this page was written; show the live docket only.
    state.term = live.term; state.cases = []; state.liveTermChanged = true;
  }
  const by = new Map(state.cases.map((c) => [c.docket, c]));
  for (const l of live.cases || []) {
    let c = by.get(l.docket);
    if (!c) {
      // Oyez also lists placeholder entries with no dates; only add cases with a real grant, argument or decision.
      if (!l.granted && !l.argued && !l.decided) continue;
      if (l.decided && l.decided < `${state.term}-10-01`) continue;
      c = { docket: l.docket, name: l.name, lower: "", topic: "Newly added", q: l.question || "Details to come.", isNew: true };
      state.cases.push(c); by.set(l.docket, c);
    }
    if (l.granted && !c.granted) c.granted = l.granted;
    if (l.argued) c.argued = l.argued;
    if (l.decided) c.decided = l.decided;
    if (l.vote) c.vote = l.vote;
    if (l.authorName) c.author = l.authorName;
    if (l.conclusion) c.holding = l.conclusion;
    if (l.oyez) c.oyez = l.oyez;
  }
  const known = new Set(SNAP.thisTermRulings.map((r) => r.d));
  for (const o of live.opinions || []) {
    const c = by.get(o.docket);
    if (c) {
      c.decided = c.decided || o.date; c.opinion = o.pdf;
      if (!c.author && o.author) c.author = SLIP_JUDGE[o.author] || o.author;
    } else if (!known.has(o.docket) && !state.extraOpinions.some((x) => x.docket === o.docket)) {
      state.extraOpinions.push({ ...o, author: SLIP_JUDGE[o.author] || o.author });
    }
  }
  const links = new Set(state.articles.map((a) => a.link));
  for (const a of live.articles || []) {
    if (!links.has(a.link)) { state.articles.push({ ...a, fresh: true }); links.add(a.link); }
  }
  state.articles.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
}

/* ---------- Tabs ---------- */
const TABS = [
  ["overview", "Overview"], ["docket", "Docket"], ["calendar", "Calendar"], ["decisions", "Decisions"],
  ["emergency", "Emergency docket"], ["justices", "Justices"], ["stats", "Stats"], ["reading", "Reading"],
];
let current = "overview";
function renderTabs() {
  const counts = { docket: state.cases.length, reading: state.articles.length };
  $("#tabs").innerHTML = TABS.map(([id, label]) =>
    `<button class="tab" role="tab" id="tab-${id}" aria-controls="view-${id}" aria-selected="${id === current}" data-tab="${id}">${label}${counts[id] ? `<span class="count">${counts[id]}</span>` : ""}</button>`).join("");
}
function show(id, push = true) {
  if (!TABS.some(([t]) => t === id)) id = "overview";
  current = id;
  document.querySelectorAll("[data-view]").forEach((v) => (v.hidden = v.dataset.view !== id));
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", t.dataset.tab === id));
  const tab = $(`#tab-${id}`); if (tab) tab.scrollIntoView({ block: "nearest", inline: "nearest" });
  if (push) { try { history.replaceState(null, "", "#" + id); } catch {} }
  window.scrollTo({ top: 0 });
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab]"); if (t) { show(t.dataset.tab); return; }
  const go = e.target.closest("[data-go]");
  if (go) {
    if (go.dataset.status) { state.filters = { ...state.filters, status: go.dataset.status, topic: "", sitting: "", q: "", watch: false }; renderDocket(); }
    show(go.dataset.go);
    if (go.dataset.day) setTimeout(() => flashDay(go.dataset.day), 50);
    return;
  }
  const open = e.target.closest("[data-case]"); if (open) { openCase(open.dataset.case); return; }
  const star = e.target.closest("[data-star]"); if (star) { toggleWatch(star.dataset.star); return; }
});

/* ---------- Overview ---------- */
function renderOverview() {
  const cs = state.cases;
  const upcoming = cs.filter((c) => statusOf(c) === "scheduled").sort((a, b) => a.argued.localeCompare(b.argued));
  const nextDay = upcoming[0]?.argued;
  const nextCases = upcoming.filter((c) => c.argued === nextDay);
  const sittingEnd = nextDay ? upcoming.filter((c) => daysBetween(nextDay, c.argued) <= 9) : [];
  const counts = countByStatus();
  const total = cs.length || 1;
  const order = ["decided", "argued", "scheduled", "granted", "dismissed"];
  const watched = cs.filter((c) => state.watch.has(c.docket));
  const latestRuling = latestDecisions()[0];

  let nextHtml;
  if (nextDay) {
    const dd = daysBetween(TODAY, nextDay);
    nextHtml = `<div class="next-top"><span class="days">${dd === 0 ? "Today" : dd}</span>
      <div><strong>${dd === 0 ? "Arguments today" : dd === 1 ? "day until the next argument" : "days until the next argument"}</strong>
      <span class="muted">${fmt(nextDay, { wd: true, y: true })} · 10 a.m. ET</span></div></div>
      <ul>${sittingEnd.map((c) => `<li><span class="mono small muted">${fmt(c.argued, { wd: true })}</span><button class="linkish" data-case="${esc(c.docket)}">${esc(c.name)}</button></li>`).join("")}</ul>
      <div><button class="linkish small" data-go="calendar" data-day="${nextDay}">See the full argument calendar</button></div>`;
  } else {
    nextHtml = `<div class="next-top"><div><strong>No arguments on the calendar right now</strong>
      <span class="muted">The Court usually announces each sitting several weeks ahead.</span></div></div>`;
  }

  $("#view-overview").innerHTML = `
    <div class="view-head">
      <span class="eyebrow">October Term ${state.term} · ${fmt(TODAY, { wd: true, y: true })}</span>
      <h2>${headline(counts)}</h2>
      <p>${state.cases.length} cases on the merits docket. ${counts.argued} argued and awaiting decision, ${counts.scheduled} scheduled, ${counts.granted} waiting for an argument date.</p>
    </div>
    <div class="hero">
      <div class="next">${nextHtml}</div>
      <div class="pipeline panel">
        <div class="section-title" style="border:0;padding:0">Where the cases stand <small>tap to filter</small></div>
        <div class="pipe-bar" role="img" aria-label="Cases by status">${order.map((s) => counts[s] ? `<span style="width:${(counts[s] / total) * 100}%;background:var(--${s})" title="${STATUS_SHORT[s]}: ${counts[s]}"></span>` : "").join("")}</div>
        <div class="pipe-legend">${order.map((s) => `<button data-go="docket" data-status="${s}"><span class="sw" style="background:var(--${s})"></span><span>${STATUS_LABEL[s]}</span><b>${counts[s]}</b></button>`).join("")}</div>
      </div>
    </div>
    <div class="cols">

        <ul class="list-plain">${(watched.length ? watched : cs.filter((c) => c.big)).slice(0, 7).map((c) => {
          const s = statusOf(c);
          return `<li><div style="display:flex;gap:8px;justify-content:space-between;align-items:baseline;flex-wrap:wrap"><button class="linkish" data-case="${esc(c.docket)}">${esc(c.name)}</button>${statusPill(s)}</div>
          <span class="meta">${esc(c.topic)} · ${s === "scheduled" || s === "argued" ? (s === "argued" ? "Argued " : "Argues ") + fmt(c.argued) : s === "decided" ? "Decided " + fmt(c.decided) : "Granted " + fmt(c.granted)}</span></li>`;
        }).join("")}</ul>
        <div><button class="linkish small" data-go="docket">Browse the full docket</button></div>
      </div>

        <ul class="list-plain">
          ${latestRuling ? `<li><span class="meta">Latest ruling · ${fmt(latestRuling.date, { y: true })}</span><button class="linkish" data-go="decisions">${esc(latestRuling.n)}</button><span class="meta">${esc(latestRuling.vote || "")}${latestRuling.vote ? " · " : ""}${esc(latestRuling.author || "")}</span></li>` : ""}
          ${SNAP.pendingEmergency.map((p) => `<li><span class="meta">Pending emergency request · filed ${fmt(p.filed)}</span><button class="linkish" data-go="emergency">${esc(p.n)}</button></li>`).join("")}
          ${state.articles.slice(0, 4).map((a) => `<li><span class="meta">${esc(a.source)} · ${fmt(a.date)}</span><a href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.title)}</a></li>`).join("")}
        </ul>

}
function headline(c) {
  if (c.argued && !c.decided) return `${c.argued} argued cases are waiting on opinions.`;
  if (c.decided) return `${c.decided} decided so far this term.`;
  return "The term is underway.";
}
function countByStatus() {
  const c = { granted: 0, scheduled: 0, argued: 0, decided: 0, dismissed: 0 };
  state.cases.forEach((x) => c[statusOf(x)]++);
  return c;
}

/* ---------- Docket ---------- */
function renderDocket() {
  const f = state.filters;
  const topics = [...new Set(state.cases.map((c) => c.topic))].sort();
  const sittings = [...new Set(state.cases.filter((c) => c.argued).sort((a, b) => a.argued.localeCompare(b.argued)).map(sittingOf))];
  const statuses = [["all", "All"], ["granted", "Awaiting date"], ["scheduled", "Scheduled"], ["argued", "Argued"], ["decided", "Decided"]];
  const view = $("#view-docket");
  if (!view.dataset.built) {
    view.innerHTML = `
      <div class="view-head"><span class="eyebrow">Merits docket</span><h2>Every case the Court has agreed to hear</h2>
      <p>Cases move from a grant of certiorari, to an argument date, to argument, to a decision. Tap a case for its question, timeline and links.</p></div>
      <div class="filters">
        <div class="filter-row"><div class="seg" id="statusSeg"></div></div>
        <div class="filter-row">
          <label class="field field-grow"><input id="q" type="search" aria-label="Search cases" placeholder="Search by name, docket number or issue" autocomplete="off"></label>
          <label class="field"><span class="small muted">Topic</span><select id="topicSel"></select></label>
          <label class="field"><span class="small muted">Sitting</span><select id="sittingSel"></select></label>
          <div class="seg"><button id="watchBtn" type="button" aria-pressed="false">★ Watchlist</button></div>
        </div>
      </div>
      <div class="result-count" id="resultCount" aria-live="polite"></div>
      <div class="cases" id="caseGrid"></div>`;
    view.dataset.built = "1";
    $("#q").addEventListener("input", (e) => { state.filters.q = e.target.value; renderDocketList(); });
    $("#topicSel").addEventListener("change", (e) => { state.filters.topic = e.target.value; renderDocketList(); });
    $("#sittingSel").addEventListener("change", (e) => { state.filters.sitting = e.target.value; renderDocketList(); });
    $("#watchBtn").addEventListener("click", () => { state.filters.watch = !state.filters.watch; renderDocketList(); });
    $("#statusSeg").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; state.filters.status = b.dataset.s; renderDocketList(); });
  }
  $("#statusSeg").innerHTML = statuses.map(([s, l]) => `<button type="button" data-s="${s}" aria-pressed="${f.status === s}">${l}</button>`).join("");
  $("#topicSel").innerHTML = `<option value="">All topics</option>` + topics.map((t) => `<option ${t === f.topic ? "selected" : ""}>${esc(t)}</option>`).join("");
  $("#sittingSel").innerHTML = `<option value="">Any</option>` + sittings.map((t) => `<option ${t === f.sitting ? "selected" : ""}>${esc(t)}</option>`).join("") + `<option value="none" ${f.sitting === "none" ? "selected" : ""}>Not yet set</option>`;
  $("#q").value = f.q;
  renderDocketList();
}
function renderDocketList() {
  const f = state.filters;
  $("#statusSeg").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.s === f.status));
  $("#watchBtn").setAttribute("aria-pressed", f.watch);
  const q = f.q.trim().toLowerCase();
  const rank = { argued: 0, scheduled: 1, granted: 2, decided: 3, dismissed: 4 };
  const list = state.cases.filter((c) => {
    const s = statusOf(c);
    if (f.status !== "all" && s !== f.status) return false;
    if (f.topic && c.topic !== f.topic) return false;
    if (f.sitting === "none" && c.argued) return false;
    if (f.sitting && f.sitting !== "none" && sittingOf(c) !== f.sitting) return false;
    if (f.watch && !state.watch.has(c.docket)) return false;
    if (q && !`${c.name} ${c.docket} ${c.topic} ${c.q} ${c.lower}`.toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => (rank[statusOf(a)] - rank[statusOf(b)]) || (a.argued || "9").localeCompare(b.argued || "9") || (a.granted || "").localeCompare(b.granted || ""));
  $("#resultCount").textContent = `${list.length} of ${state.cases.length} cases`;
  $("#caseGrid").innerHTML = list.length ? list.map(caseCard).join("") :
    `<div class="empty">${f.watch && !state.watch.size ? "Your watchlist is empty. Tap the star on any case to follow it." : "No cases match these filters."}</div>`;
}
const STAR = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
function caseCard(c) {
  const s = statusOf(c);
  const when = s === "decided" ? `Decided ${fmt(c.decided)}${c.vote ? " · " + esc(c.vote) : ""}` : s === "argued" ? `Argued ${fmt(c.argued)}` : s === "scheduled" ? `Argues ${fmt(c.argued, { wd: true })}` : s === "dismissed" ? `Dismissed ${fmt(c.dismissed)}` : `Granted ${fmt(c.granted)}`;
  return `<article class="case">
    <div class="case-top"><span class="mono">No. ${esc(c.docket)}</span>${statusPill(s)}</div>
    <h3><button data-case="${esc(c.docket)}">${esc(c.name)}</button></h3>
    <p>${esc(c.q)}</p>
    <div class="case-foot"><div class="tags"><span class="chip">${esc(c.topic)}</span>${c.big ? `<span class="flag">Major</span>` : ""}${c.isNew ? `<span class="flag">New</span>` : ""}</div>
      <span>${when}</span>
      <button class="star" data-star="${esc(c.docket)}" aria-pressed="${state.watch.has(c.docket)}" aria-label="${state.watch.has(c.docket) ? "Remove from" : "Add to"} watchlist">${STAR}</button></div>
  </article>`;
}
function toggleWatch(d) {
  state.watch.has(d) ? state.watch.delete(d) : state.watch.add(d);
  store("watch", [...state.watch]);
  document.querySelectorAll(`[data-star="${CSS.escape(d)}"]`).forEach((b) => { b.setAttribute("aria-pressed", state.watch.has(d)); b.setAttribute("aria-label", (state.watch.has(d) ? "Remove from" : "Add to") + " watchlist"); });
  if (state.filters.watch && current === "docket") renderDocketList();
  if (current !== "overview") renderOverview();
}

/* ---------- Case dialog ---------- */
function openCase(d) {
  const c = state.cases.find((x) => x.docket === d); if (!c) return;
  const s = statusOf(c);
  const steps = [
    { label: "Granted", date: c.granted, done: !!c.granted },
    { label: s === "scheduled" ? "Argument set" : "Argued", date: c.argued, done: s === "argued" || s === "decided" },
    { label: s === "dismissed" ? "Dismissed" : "Decided", date: c.decided || c.dismissed, done: s === "decided" || s === "dismissed" },
  ];
  const nextIdx = steps.findIndex((x) => !x.done);
  const links = [
    [docketUrl(c.docket), "Official docket"],
    [blogSearch(c.name), "SCOTUSblog coverage"],
    c.oyez && [c.oyez, "Oyez (audio and summary)"],
    c.opinion && [c.opinion, "Read the opinion (PDF)"],
  ].filter(Boolean);
  $("#dlgBody").innerHTML = `
    <div class="dlg-head"><div class="stack" style="gap:6px"><span class="mono small muted">No. ${esc(c.docket)} · ${esc(c.lower || "Lower court not listed")}</span>
      <h2 id="dlgTitle">${esc(c.name)}</h2><div style="display:flex;gap:8px;flex-wrap:wrap">${statusPill(s)}<span class="chip">${esc(c.topic)}</span></div></div>
      <button class="x" type="button" aria-label="Close" data-close>×</button></div>
    <div class="stack" style="gap:4px"><span class="eyebrow" style="font-size:.6875rem">The question</span><p>${esc(c.q)}</p></div>
    ${c.holding ? `<div class="stack" style="gap:4px"><span class="eyebrow" style="font-size:.6875rem">The ruling</span><p>${esc(c.holding)}</p></div>` : ""}
    ${s === "decided" && (c.vote || c.author) ? `<p class="small muted">${esc(c.vote || "")}${c.vote && c.author ? " · " : ""}${c.author ? "Opinion by " + esc(c.author) : ""}</p>` : ""}
    <ol class="timeline">${steps.map((x, i) => `<li class="${x.done ? "done" : i === nextIdx ? "next-step" : ""}"><b>${x.label}</b><span class="muted">${x.date ? fmt(x.date, { y: true }) : "Not yet"}</span></li>`).join("")}</ol>
    ${s === "granted" || s === "scheduled" ? briefStrip() : ""}
    <div class="dlg-links">${links.map(([u, l]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${l} ↗</a>`).join("")}</div>
    <button class="linkish small" data-star="${esc(c.docket)}" aria-pressed="${state.watch.has(c.docket)}">${state.watch.has(c.docket) ? "★ On your watchlist" : "☆ Add to watchlist"}</button>`;
  const dlg = $("#caseDialog");
  if (typeof dlg.showModal === "function") { if (!dlg.open) dlg.showModal(); } else dlg.setAttribute("open", "");
}
function briefStrip() {
  // Supreme Court Rule 33.1(g) assigns each kind of merits brief its own cover color.
  const covers = [["Petitioner", "#cfe0f3"], ["Respondent", "#e7b8b8"], ["Reply", "#f4e29a"], ["Amicus (pet.)", "#cfe8c8"], ["Amicus (resp.)", "#7fae84"], ["U.S. (SG)", "#c9cbcf"]];
  return `<div class="brief-strip"><span class="small muted">Briefing in progress. Under Rule 33, each merits brief arrives in its own cover color:</span>
    <div class="covers">${covers.map(([l, c]) => `<span style="background:${c}">${l}</span>`).join("")}</div></div>`;
}
$("#caseDialog").addEventListener("click", (e) => {
  if (e.target.closest("[data-close]") || e.target === e.currentTarget) e.currentTarget.close();
  const star = e.target.closest("[data-star]");
  if (star) { setTimeout(() => openCase(star.dataset.star), 0); }
});

/* ---------- Calendar ---------- */
function renderCalendar() {
  const days = {};
  state.cases.filter((c) => c.argued && !c.dismissed).forEach((c) => (days[c.argued] ||= []).push(c));
  const keys = Object.keys(days).sort();
  const months = [...new Set(keys.map((k) => k.slice(0, 7)))];
  const unscheduled = state.cases.filter((c) => statusOf(c) === "granted");
  $("#view-calendar").innerHTML = `
    <div class="view-head"><span class="eyebrow">Argument calendar</span><h2>Sittings for October Term ${state.term}</h2>
    <p>The Court hears arguments in two-week sittings, usually Monday through Wednesday at 10 a.m. Eastern. Highlighted days have arguments; tap one to jump to it.</p></div>
    <div class="months">${months.map((m) => monthGrid(m, days)).join("")}</div>
    <div class="stack"><div class="section-title">Day by day <small>${keys.length} argument days</small></div>
      <div class="agenda">${keys.map((k) => `<div class="agenda-day" id="day-${k}">
        <time datetime="${k}">${fmt(k, { wd: true })}<span>${k < TODAY ? "Argued" : k === TODAY ? "Today" : `in ${daysBetween(TODAY, k)} days`}</span></time>
        <ul>${days[k].map((c) => `<li><button class="linkish" data-case="${esc(c.docket)}">${esc(c.name)}</button><span class="chip">${esc(c.topic)}</span></li>`).join("")}</ul></div>`).join("")}</div></div>
    ${unscheduled.length ? `<div class="stack"><div class="section-title">Granted, not yet scheduled <small>${unscheduled.length} cases, likely argued in early 2027</small></div>
      <ul class="list-plain">${unscheduled.map((c) => `<li><button class="linkish" data-case="${esc(c.docket)}">${esc(c.name)}</button><span class="meta">Granted ${fmt(c.granted, { y: true })} · ${esc(c.topic)}</span></li>`).join("")}</ul></div>` : ""}`;
  $("#view-calendar").querySelectorAll("button.d.arg").forEach((b) => b.addEventListener("click", () => flashDay(b.dataset.k)));
}
function monthGrid(ym, days) {
  const [y, m] = ym.split("-").map(Number);
  const first = new Date(y, m - 1, 1), n = new Date(y, m, 0).getDate();
  const lead = (first.getDay() + 6) % 7; // Monday first
  let cells = ["M", "T", "W", "T", "F", "S", "S"].map((d) => `<span class="dow">${d}</span>`).join("");
  cells += "<span></span>".repeat(lead);
  for (let d = 1; d <= n; d++) {
    const k = `${y}-${pad(m)}-${pad(d)}`;
    const cls = ["d", days[k] ? "arg" : "", k < TODAY ? "past" : "", k === TODAY ? "today" : ""].join(" ");
    cells += days[k] ? `<button type="button" class="${cls}" data-k="${k}" aria-label="${fmt(k, { wd: true })}: ${days[k].length} case${days[k].length > 1 ? "s" : ""}">${d}</button>` : `<span class="${cls}">${d}</span>`;
  }
  const count = Object.keys(days).filter((k) => k.startsWith(ym)).reduce((s, k) => s + days[k].length, 0);
  return `<div class="month"><h3>${["January","February","March","April","May","June","July","August","September","October","November","December"][m - 1]} ${y}</h3>
    <div class="grid7">${cells}</div><span class="small muted">${count} case${count === 1 ? "" : "s"} argued</span></div>`;
}
function flashDay(k) {
  const el = document.getElementById("day-" + k); if (!el) return;
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1400);
}

/* ---------- Decisions ---------- */
function latestDecisions() {
  const fromCases = state.cases.filter((c) => c.decided).map((c) => ({ n: c.name, d: c.docket, date: c.decided, vote: c.vote, author: c.author, s: c.holding || c.q, kind: "Merits opinion", pdf: c.opinion, docket: c.docket }));
  const extra = state.extraOpinions.map((o) => ({ n: o.name, d: o.docket, date: o.date, author: o.author, s: "Opinion released by the Court.", kind: "Opinion", pdf: o.pdf }));
  return [...fromCases, ...extra, ...SNAP.thisTermRulings].sort((a, b) => b.date.localeCompare(a.date));
}
const BENCH = ["R", "T", "A", "S", "K", "G", "Kv", "B", "J"];
function dots(majList) {
  const maj = new Set(majList);
  return `<div class="dots" aria-hidden="true">${BENCH.map((k) => `<span><i class="${maj.has(k) ? "maj" : ""}"></i>${k}</span>`).join("")}</div>`;
}
function renderDecisions() {
  const now = latestDecisions();
  $("#view-decisions").innerHTML = `
    <div class="view-head"><span class="eyebrow">Opinions</span><h2>Decisions</h2>
    <p>Opinions are usually released at 10 a.m. Eastern on announced decision days, with most big cases arriving in May and June.</p></div>
    <div class="stack"><div class="section-title">This term <small>${now.length} so far</small></div>
      <div class="rulings">${now.length ? now.map((r) => `<div class="ruling"><div class="stack" style="gap:6px">
        <span class="meta">${esc(r.kind || "")} · ${fmt(r.date, { y: true })}${r.d ? ` · <span class="mono">No. ${esc(r.d)}</span>` : ""}</span>
        <h3>${r.docket ? `<button class="linkish" data-case="${esc(r.docket)}">${esc(r.n)}</button>` : esc(r.n)}</h3><p>${esc(r.s || "")}</p>
        ${r.pdf ? `<a class="small" href="${esc(r.pdf)}" target="_blank" rel="noopener">Read the opinion ↗</a>` : ""}</div>
        <div class="vote">${r.vote ? `<span class="vote-num">${esc(r.vote)}</span>` : ""}${r.dissent ? dots(BENCH.filter((k) => !r.dissent.includes(k))) : ""}<span class="small muted">${esc(r.author || "")}</span></div></div>`).join("")
        : `<div class="empty">No opinions yet this term. Argued cases will appear here when they are decided.</div>`}</div></div>
    <div class="stack"><div class="section-title">Last term’s landmark rulings <small>October Term ${SNAP.term - 1}</small></div>
      <div class="legend"><span><i style="background:var(--ink)"></i>In the majority</span><span><i style="border:1.5px solid var(--ink)"></i>Dissented</span></div>
      <div class="rulings">${SNAP.lastTerm.map((r) => {
        const maj = r.maj.split(" ");
        return `<div class="ruling"><div class="stack" style="gap:6px"><span class="meta">${esc(r.t)} · ${fmt(r.date, { y: true })} · Opinion by ${esc(r.author)}</span>
          <h3>${esc(r.n)}</h3><p>${esc(r.s)}</p></div>
          <div class="vote"><span class="vote-num">${maj.length}–${9 - maj.length}</span>${dots(maj)}</div></div>`;
      }).join("")}</div></div>`;
}

/* ---------- Justices ---------- */
function age(born) { const b = parseDay(born), t = parseDay(TODAY); let a = t.getFullYear() - b.getFullYear(); if (t < new Date(t.getFullYear(), b.getMonth(), b.getDate())) a--; return a; }
function renderJustices() {
  const avgAge = Math.round(JUSTICES.reduce((s, j) => s + age(j.born), 0) / 9);
  $("#view-justices").innerHTML = `
    <div class="view-head"><span class="eyebrow">The bench</span><h2>Nine justices</h2>
    <p>Listed in order of seniority, the order in which they speak at conference and vote. Average age ${avgAge}. Six were appointed by Republican presidents and three by Democratic presidents.</p></div>
    <div class="bench">${JUSTICES.map((j) => {
      const yrs = Math.floor(daysBetween(j.since, TODAY) / 365.25);
      return `<article class="justice"><div class="j-head"><span class="seal">${j.k}</span><div><h3>${esc(j.name)}</h3><span class="small muted">${j.role}</span></div></div>
        <dl><dt>Appointed by</dt><dd>${j.by}</dd><dt>Joined the Court</dt><dd>${fmt(j.since, { y: true })}</dd><dt>Years serving</dt><dd>${yrs}</dd><dt>Age</dt><dd>${age(j.born)}</dd></dl>
        <p class="j-note">${j.note}</p></article>`;
    }).join("")}</div>
    <div class="panel"><div class="section-title" style="border:0;padding:0">Closest pairs last term <small>overall agreement</small></div>
      <ul class="facts"><li><span>Roberts and Kavanaugh</span><b>94%</b></li><li><span>Thomas and Alito</span><b>94%</b></li><li><span>Sotomayor and Kagan</span><b>94%</b></li><li><span>Sotomayor and Jackson</span><b>94%</b></li></ul></div>`;
}

/* ---------- Stats ---------- */
function renderStats() {
  const c = countByStatus();
  const topicCounts = {}, courtCounts = {};
  state.cases.forEach((x) => { topicCounts[x.topic] = (topicCounts[x.topic] || 0) + 1; const k = /Cir\./.test(x.lower || "") ? x.lower : x.lower ? "State courts" : "Other"; courtCounts[k] = (courtCounts[k] || 0) + 1; });
  const bars = (obj) => { const e = Object.entries(obj).sort((a, b) => b[1] - a[1]); const max = e[0]?.[1] || 1;
    return e.map(([k, v]) => `<div class="hbar"><span>${esc(k)}</span><span class="track"><span class="fill" style="display:block;width:${(v / max) * 100}%"></span></span><span class="n">${v}</span></div>`).join(""); };
  const gm = state.cases.filter((x) => x.granted).map((x) => x.granted.slice(0, 7)).sort();
  const grantsByMonth = {}; gm.forEach((m) => (grantsByMonth[m] = (grantsByMonth[m] || 0) + 1));
  $("#view-stats").innerHTML = `
    <div class="view-head"><span class="eyebrow">By the numbers</span><h2>Term statistics</h2>
    <p>This term’s figures update with the docket. Last term’s figures come from SCOTUSblog’s end-of-term analysis.</p></div>
    <div class="stack"><div class="section-title">October Term ${state.term} so far</div>
      <div class="tiles">
        <div class="tile"><b>${state.cases.filter((x) => !x.dismissed).length}</b><span>cases on the docket</span></div>
        <div class="tile"><b>${c.argued + c.decided}</b><span>argued</span></div>
        <div class="tile"><b>${c.decided}</b><span>decided</span></div>
        <div class="tile"><b>${c.scheduled}</b><span>scheduled for argument</span></div>
        <div class="tile"><b>${c.granted}</b><span>awaiting an argument date</span></div>
        <div class="tile"><b>${c.dismissed}</b><span>dismissed</span></div>
      </div>
      <div class="cols">
        <div class="panel"><div class="section-title" style="border:0;padding:0">Cases by topic</div><div class="hbars">${bars(topicCounts)}</div></div>
        <div class="panel"><div class="section-title" style="border:0;padding:0">Where the cases come from</div><div class="hbars">${bars(courtCounts)}</div>
          <div class="section-title" style="border:0;padding:0;margin-top:8px">Grants by month</div><div class="hbars">${Object.entries(grantsByMonth).map(([m, v]) => { const mx = Math.max(...Object.values(grantsByMonth)); return `<div class="hbar"><span>${fmt(m)}</span><span class="track"><span class="fill" style="display:block;width:${(v / mx) * 100}%"></span></span><span class="n">${v}</span></div>`; }).join("")}</div></div>
      </div>
    </div>
    <div class="stack"><div class="section-title">October Term ${SNAP.term - 1} in review</div>
      <div class="panel"><div class="section-title" style="border:0;padding:0">How the Court split <small>share of decisions</small></div>
        <div class="legend"><span><i style="background:var(--muted)"></i>OT2024</span><span><i style="background:var(--accent)"></i>OT2025</span></div>
        <div class="chart-wrap">${splitChart()}</div></div>
      <div class="cols">
        <div class="panel"><div class="section-title" style="border:0;padding:0">In the majority most often</div>
          <div class="hbars">${[["Roberts", 95], ["Kavanaugh", 95], ["Barrett", 92], ["Jackson", 67]].map(([n, v]) => `<div class="hbar"><span>${n}</span><span class="track"><span class="fill" style="display:block;width:${v}%"></span></span><span class="n">${v}%</span></div>`).join("")}</div>
          <span class="small muted">SCOTUSblog reported these four. Jackson was in the majority in 41% of non-unanimous cases.</span></div>
        <div class="panel"><ul class="facts">
          <li><span>Opinions written (majority, concurring, dissenting)</span><b>164</b></li>
          <li><span>Majority opinions</span><b>66</b></li>
          <li><span>Longest decision: Trump v. Barbara</span><b>60,400 words</b></li>
          <li><span>Longest wait after argument: Landor v. Louisiana</span><b>226 days</b></li>
          <li><span>Fastest signed decision: Hikma v. Amarin</span><b>37 days</b></li>
          <li><span>Post-2005 average unanimity</span><b>44.5%</b></li>
        </ul></div>
      </div>
    </div>`;
}
function splitChart() {
  const rows = [["Unanimous", 42.4, 44], ["6–3 decisions", 15.2, 28.8], ["Ideological 6–3", 9, 22.7], ["Liberals dissenting together", 15, 24.2]];
  const W = 640, rowH = 54, top = 10, left = 190, right = 56, H = top + rows.length * rowH + 24;
  const x = (v) => left + (v / 50) * (W - left - right);
  let g = "";
  for (const t of [0, 10, 20, 30, 40, 50]) g += `<line x1="${x(t)}" x2="${x(t)}" y1="${top}" y2="${H - 22}" stroke="var(--line)"/><text x="${x(t)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--muted)">${t}%</text>`;
  rows.forEach(([label, a, b], i) => {
    const y = top + i * rowH + 8;
    g += `<text x="0" y="${y + 18}" font-size="13" fill="var(--ink)">${label}</text>`;
    g += `<rect x="${left}" y="${y}" width="${x(a) - left}" height="14" rx="2" fill="var(--muted)"/><text x="${x(a) + 6}" y="${y + 11}" font-size="11" fill="var(--muted)">${a}%</text>`;
    g += `<rect x="${left}" y="${y + 18}" width="${x(b) - left}" height="14" rx="2" fill="var(--accent)"/><text x="${x(b) + 6}" y="${y + 29}" font-size="11" font-weight="600" fill="var(--ink)">${b}%</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Unanimous 42.4% to 44%; 6–3 decisions 15.2% to 28.8%; ideological 6–3 9% to 22.7%; liberal joint dissents 15% to 24.2%">${g}</svg>`;
}

        <a href="https://www.scotusblog.com/" target="_blank" rel="noopener"><b>SCOTUSblog</b><span>News and case files</span></a>
        <a href="https://www.oyez.org/cases/${state.term}" target="_blank" rel="noopener"><b>Oyez</b><span>Case summaries and audio</span></a>
      </div></div>`;

/* ---------- Header + boot ---------- */
function renderHeader() {
  $("#termLine").innerHTML = `<b>October Term ${state.term}</b> · ${state.cases.length} cases · Next update automatic`;
  const pill = $("#livePill");
  if (state.liveAt) {
    const d = new Date(state.liveAt);
    pill.dataset.state = "live";
    $("#liveText").textContent = `Live · updated ${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
  } else {
    pill.dataset.state = "snapshot";
    $("#liveText").textContent = `Saved data · ${fmt(SNAPSHOT_DATE, { y: true })}`;
  }
  $("#footSources").innerHTML = `Data: Supreme Court of the United States, Oyez, SCOTUSblog and other outlets linked on each item. ${state.liveAt ? "Live updates are pulled from GitHub every few hours." : "Showing data saved " + fmt(SNAPSHOT_DATE, { y: true }) + "."}`;
}
function renderAll() {
  renderHeader(); renderTabs(); renderOverview(); renderDocket(); renderCalendar();
  renderDecisions(); renderEmergency(); renderJustices(); renderStats(); renderReading();
  show(current, false);
}

const initial = (location.hash || "").replace("#", "");
if (TABS.some(([t]) => t === initial)) current = initial;
renderAll();
loadLive().then((ok) => { if (ok) renderAll(); });
window.addEventListener("hashchange", () => show(location.hash.replace("#", ""), false));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") loadLive().then((ok) => ok && renderAll()); });

/* ---------- Install as an app ---------- */
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredPrompt = e; $("#installBtn").hidden = false; });
$("#installBtn").addEventListener("click", async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); try { await deferredPrompt.userChoice; } catch {} deferredPrompt = null; $("#installBtn").hidden = true; });
if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !window.navigator.standalone) $("#iosHint").hidden = false;
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
