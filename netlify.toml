# Netlify serves the site folder as-is. There is no build step.
[build]
  publish = "site"
  command = ""
  # Data refreshes from the GitHub workflow only touch site/data/live.json,
  # and the site reads that file straight from GitHub, so skip deploys for them.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)site/data/live.json'"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
